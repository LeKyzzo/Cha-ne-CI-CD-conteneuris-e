name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Run tests
        run: |
          cd backend
          npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t vitalsync-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t vitalsync-frontend ./frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "POSTGRES_USER=admin" >> .env
          echo "POSTGRES_PASSWORD=admin123" >> .env
          echo "POSTGRES_DB=vitalsync" >> .env

      - name: Run docker compose
        run: docker compose up -d --build

      - name: Wait for backend
        run: sleep 10

      - name: Health check
        run: |
          curl -f http://localhost:3000/health